    <script>
      // GitHub Pages SPA redirect fallback (supports both repo subpath and custom domain root)
      (function (l) {
        if (!l.search || l.search[1] !== '/') return;
        var pathSegments = l.pathname.split('/').filter(Boolean);
        var isGithubIo = /\.github\.io$/i.test(l.hostname);
        var segmentsToKeep = isGithubIo && pathSegments.length > 0 ? 1 : 0;
        var prefix = '/' + pathSegments.slice(0, segmentsToKeep).join('/');
        if (prefix !== '/') prefix += '/';
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) { return s.replace(/~and~/g, '&'); })
          .join('?');
        var normalized = decoded[0] === '/' ? decoded.slice(1) : decoded;
        window.history.replaceState(null, null, prefix + normalized + l.hash);
      })(window.location);
    </script>
