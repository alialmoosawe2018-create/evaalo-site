<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback:
      // Redirect unknown path to index + encoded route query.
      // Works for:
      // - username.github.io/repo-name (keep repo segment)
      // - custom domain root (keep no segment)
      (function () {
        var l = window.location;
        var parts = l.pathname.split('/').filter(Boolean);
        var isGithubIo = /\.github\.io$/i.test(l.hostname);
        var keep = isGithubIo && parts.length > 0 ? 1 : 0;
        var prefix = '/' + parts.slice(0, keep).join('/');
        if (prefix !== '/') prefix += '/';
        var rest = parts.slice(keep).join('/');
        var next =
          l.protocol +
          '//' +
          l.host +
          prefix +
          '?/' +
          rest.replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;
        l.replace(next);
      })();
    </script>
  </head>
  <body></body>
</html>
