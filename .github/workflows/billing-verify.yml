name: Billing verification

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'apps/backend/src/**/billing*.ts'
      - 'apps/backend/src/**/stripe*.ts'
      - 'apps/backend/src/models/OrgPlanState.ts'
      - 'apps/backend/src/models/Credit*.ts'
      - 'apps/backend/src/scripts/verify-billing*.ts'
      - 'apps/backend/src/services/billing*.ts'
      - '.github/workflows/billing-verify.yml'
  pull_request:
    paths:
      - 'apps/backend/src/**/billing*.ts'
      - 'apps/backend/src/**/stripe*.ts'
      - 'apps/backend/src/models/OrgPlanState.ts'
      - 'apps/backend/src/models/Credit*.ts'
      - 'apps/backend/src/scripts/verify-billing*.ts'
      - 'apps/backend/src/services/billing*.ts'
      - '.github/workflows/billing-verify.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check

  billing-runtime:
    runs-on: ubuntu-latest
    needs: typecheck
    # `if: ${{ secrets.MONGODB_URI != '' }}` used to sit here. The `secrets`
    # context is not available in a job-level `if`, so GitHub rejected the whole
    # workflow at startup: every push since showed a red "billing-verify" that
    # had run zero jobs, and the billing checks below never once executed.
    # The secret is read through env in a step instead, which is allowed.
    #
    # Second fault, hidden behind the first: it installed with
    # cache-dependency-path: apps/backend/package-lock.json, and that file is
    # gitignored. Only the root lockfile is committed, so `npm ci` there could
    # never have worked. Installs from the root now, like checks.yml.
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Is a database configured?
        id: guard
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MONGODB_URI is not set — skipping the billing runtime checks."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.configured == 'true'
      - name: Phase 2a runtime verify
        if: steps.guard.outputs.configured == 'true'
        working-directory: apps/backend
        run: npx tsx src/scripts/verify-billing-phase2a.ts
      - name: Phase 2b Stripe translator verify
        if: steps.guard.outputs.configured == 'true'
        working-directory: apps/backend
        run: npx tsx src/scripts/verify-billing-phase2b.ts
