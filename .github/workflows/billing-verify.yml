name: Billing verification

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'apps/backend/src/**/billing*.ts'
      - 'apps/backend/src/**/stripe*.ts'
      - 'apps/backend/src/models/OrgPlanState.ts'
      - 'apps/backend/src/models/Credit*.ts'
      - 'apps/backend/src/scripts/verify-billing*.ts'
      - 'apps/backend/src/services/billing*.ts'
      - '.github/workflows/billing-verify.yml'
  pull_request:
    paths:
      - 'apps/backend/src/**/billing*.ts'
      - 'apps/backend/src/**/stripe*.ts'
      - 'apps/backend/src/models/OrgPlanState.ts'
      - 'apps/backend/src/models/Credit*.ts'
      - 'apps/backend/src/scripts/verify-billing*.ts'
      - 'apps/backend/src/services/billing*.ts'
      - '.github/workflows/billing-verify.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run type-check

  billing-runtime:
    runs-on: ubuntu-latest
    needs: typecheck
    if: ${{ secrets.MONGODB_URI != '' }}
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - name: Phase 2a runtime verify
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NODE_ENV: test
        run: npx tsx src/scripts/verify-billing-phase2a.ts
      - name: Phase 2b Stripe translator verify
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NODE_ENV: test
        run: npx tsx src/scripts/verify-billing-phase2b.ts
