# The safety net for the person/application separation.
#
# These scripts already existed and tested exactly what the refactor puts at
# risk — and every one of them was run by hand, so nothing caught a regression
# between one session and the next. This wires them to the paths that break them.
#
# NOT modelled on billing-verify.yml's secret guard: `if: ${{ secrets.X != '' }}`
# at job level is rejected by GitHub (the `secrets` context is not available
# there), which is why that workflow has been failing at startup with zero jobs
# on every push. The guard here reads the secret through `env` in a step, which
# is allowed.
name: Candidate model verification

on:
  # Manual trigger: lets these be run on demand — e.g. to confirm the
  # database-backed jobs really execute once a MONGODB_URI secret exists,
  # without pushing a commit just to fire them.
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'apps/backend/src/models/Candidate*.ts'
      - 'apps/backend/src/models/CandidateApplication.ts'
      - 'apps/backend/src/services/candidateApplicationService.ts'
      - 'apps/backend/src/services/applicationJobContext.ts'
      - 'apps/backend/src/services/interviewLinkAccess.ts'
      - 'apps/backend/src/services/campaignComparePool.ts'
      - 'apps/backend/src/config/applicationOwnership.ts'
      - 'apps/backend/src/repositories/candidateApplicationRepository.ts'
      - 'apps/backend/src/routes/candidates.ts'
      - 'apps/backend/src/routes/publicCampaign.ts'
      - 'apps/backend/src/routes/videoInterview.ts'
      - 'apps/backend/src/server.ts'
      - 'apps/backend/src/scripts/application-job-context-test.ts'
      - 'apps/backend/src/scripts/returning-applicant-eval-test.ts'
      - 'apps/backend/src/scripts/verifyApplicationOwnership.ts'
      - 'apps/backend/src/scripts/smokeM2mScenarios.ts'
      - '.github/workflows/candidate-model-verify.yml'
  pull_request:
    paths:
      - 'apps/backend/src/models/Candidate*.ts'
      - 'apps/backend/src/models/CandidateApplication.ts'
      - 'apps/backend/src/services/candidateApplicationService.ts'
      - 'apps/backend/src/services/applicationJobContext.ts'
      - 'apps/backend/src/services/interviewLinkAccess.ts'
      - 'apps/backend/src/services/campaignComparePool.ts'
      - 'apps/backend/src/config/applicationOwnership.ts'
      - 'apps/backend/src/repositories/candidateApplicationRepository.ts'
      - 'apps/backend/src/routes/candidates.ts'
      - 'apps/backend/src/routes/publicCampaign.ts'
      - 'apps/backend/src/routes/videoInterview.ts'
      - 'apps/backend/src/server.ts'
      - 'apps/backend/src/scripts/application-job-context-test.ts'
      - 'apps/backend/src/scripts/returning-applicant-eval-test.ts'
      - 'apps/backend/src/scripts/verifyApplicationOwnership.ts'
      - 'apps/backend/src/scripts/smokeM2mScenarios.ts'
      - '.github/workflows/candidate-model-verify.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check

  # Runs on mongodb-memory-server, so it needs no secret and always runs. This
  # is the job that actually guards the separation: same person, two campaigns,
  # independent job, evaluation and interview link.
  ownership-tests:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Both ways round: with the flag off nothing may change, with it on the
      # application must own its state. A rollback has to stay whole.
      - name: Application ownership — flag off
        env:
          APPLICATION_OWNS_CAMPAIGN_STATE: 'false'
          NODE_ENV: test
        run: npm run test:job-context --workspace=apps/backend
      - name: Application ownership — flag on
        env:
          APPLICATION_OWNS_CAMPAIGN_STATE: 'true'
          NODE_ENV: test
        run: npm run test:job-context --workspace=apps/backend

  database-verify:
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Is a database configured?
        id: guard
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Checks skipped::MONGODB_URI is not set, so the database-backed checks did not run."
            {
              echo "### :warning: The database-backed checks did not run"
              echo ""
              echo "No \`MONGODB_URI\` secret is configured, so this job passed without verifying anything."
              echo "Point it at a **test** database — these scripts write and delete records."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.configured == 'true'
      - name: Independent evaluations for a returning applicant
        if: steps.guard.outputs.configured == 'true'
        run: npm run test:returning-applicant --workspace=apps/backend
      - name: Multi-tenant smoke (scenario 5 = independent evaluations)
        if: steps.guard.outputs.configured == 'true'
        run: npm run test:m2m-smoke --workspace=apps/backend
      # Asserts the inverse of what the old migration verifier asserted: the
      # person must NOT be the source of campaign state. Add --strict once
      # phase 3 has wiped the pre-existing inherited evaluations.
      - name: No application inherits another's state
        if: steps.guard.outputs.configured == 'true'
        run: npm run verify:application-ownership --workspace=apps/backend
